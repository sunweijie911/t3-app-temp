version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      nextjs:
        patterns:
          - 'next'
      trpc:
        patterns:
          - '@trpc/*'
          - '@tanstack/react-query'
      drizzle:
        patterns:
          - 'drizzle-orm'
          - 'drizzle-kit'
      biome:
        patterns:
          - '@biomejs/*'
      unocss:
        patterns:
          - 'unocss'
          - '@unocss/*'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - '@testing-library/*'
      playwright:
        patterns:
          - '@playwright/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
