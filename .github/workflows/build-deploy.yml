# 构建与部署工作流
# 构建 Docker 镜像推送到 GHCR，通过 SSH 部署到服务器
#
# 触发条件: 仅手动触发 (workflow_dispatch)，可选择是否部署
#
# 配置步骤:
#   在 GitHub 仓库 Settings -> Secrets and variables -> Actions 中添加:
#     - DEPLOY_SERVER_HOST: 服务器 IP 或域名
#     - DEPLOY_SERVER_USER: SSH 用户名
#     - DEPLOY_SERVER_PATH: 部署目标路径
#     - DEPLOY_SSH_PRIVATE_KEY: SSH 私钥 (完整内容，包括 BEGIN/END)
#     - DEPLOY_HOST_PORT: (可选) 服务端口，默认 80
#
#   NEXT_PUBLIC_* 是【构建期】变量（会被内联进客户端 bundle，运行时 .env 改不动），
#   需配在 Settings -> Secrets and variables -> Actions -> Variables（非 Secrets，非敏感）:
#     - NEXT_PUBLIC_SITE_NAME / NEXT_PUBLIC_AUTH_METHOD /
#       NEXT_PUBLIC_DEFAULT_MODULE / NEXT_PUBLIC_ENABLED_MODULES / NEXT_PUBLIC_MODULE_NAMES
#     - NEXT_PUBLIC_DINGTALK_CORP_ID（登录方式为 dingtalk 时的兜底 corpId）
#   未配置时由各消费点的下游兜底回退到合理默认（如登录方式回退 email-otp）。

name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: '是否部署到服务器'
        required: true
        default: true
        type: boolean

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# github.repository may contain uppercase letters (e.g. sunweijieMJ/t3-app-temp)
# but Docker requires lowercase image names, so we normalize it in the prepare step.

jobs:
  # ==================== 构建并推送到 GHCR ====================
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      git_hash: ${{ steps.info.outputs.git_hash }}
      build_time: ${{ steps.info.outputs.build_time }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Normalize image name
        id: repo
        run: echo "image_name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Generate build info
        id: info
        run: |
          echo "git_hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (app)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: runner
          # NEXT_PUBLIC_* 是构建期变量（会被内联进客户端 bundle），
          # 在 GitHub 仓库 Settings -> Secrets and variables -> Actions -> Variables 中配置。
          # 未配置时传空串，由各消费点的下游兜底回退到合理默认。
          build-args: |
            NEXT_PUBLIC_SITE_NAME=${{ vars.NEXT_PUBLIC_SITE_NAME }}
            NEXT_PUBLIC_MODULE_NAMES=${{ vars.NEXT_PUBLIC_MODULE_NAMES }}
            NEXT_PUBLIC_DEFAULT_MODULE=${{ vars.NEXT_PUBLIC_DEFAULT_MODULE }}
            NEXT_PUBLIC_ENABLED_MODULES=${{ vars.NEXT_PUBLIC_ENABLED_MODULES }}
            NEXT_PUBLIC_AUTH_METHOD=${{ vars.NEXT_PUBLIC_AUTH_METHOD }}
            NEXT_PUBLIC_DINGTALK_CORP_ID=${{ vars.NEXT_PUBLIC_DINGTALK_CORP_ID }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Extract nginx metadata
        id: nginx-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}-nginx
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (nginx)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: nginx
          # nginx 镜像从 builder 阶段拷贝 .next/static（已内联 NEXT_PUBLIC_*），
          # 必须与 app 镜像使用完全相同的 build-args，否则静态资源与服务端取值不一致。
          build-args: |
            NEXT_PUBLIC_SITE_NAME=${{ vars.NEXT_PUBLIC_SITE_NAME }}
            NEXT_PUBLIC_MODULE_NAMES=${{ vars.NEXT_PUBLIC_MODULE_NAMES }}
            NEXT_PUBLIC_DEFAULT_MODULE=${{ vars.NEXT_PUBLIC_DEFAULT_MODULE }}
            NEXT_PUBLIC_ENABLED_MODULES=${{ vars.NEXT_PUBLIC_ENABLED_MODULES }}
            NEXT_PUBLIC_AUTH_METHOD=${{ vars.NEXT_PUBLIC_AUTH_METHOD }}
            NEXT_PUBLIC_DINGTALK_CORP_ID=${{ vars.NEXT_PUBLIC_DINGTALK_CORP_ID }}
          tags: ${{ steps.nginx-meta.outputs.tags }}
          labels: ${{ steps.nginx-meta.outputs.labels }}

  # ==================== 部署到服务器 ====================
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: inputs.deploy
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production

    steps:
      - name: Checkout (for deploy scripts)
        uses: actions/checkout@v6

      - name: Normalize image name
        id: repo
        run: echo "image_name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Check secrets
        run: |
          has_error=0
          for secret_name in DEPLOY_SERVER_HOST DEPLOY_SERVER_USER DEPLOY_SERVER_PATH DEPLOY_SSH_PRIVATE_KEY; do
            eval "val=\${$secret_name:-}"
            if [[ -z "$val" ]]; then
              echo "::error::缺少 ${secret_name} secret"
              has_error=1
            fi
          done
          if [[ $has_error -eq 1 ]]; then
            echo "请在 Settings -> Secrets and variables -> Actions 中配置以上 secrets"
            exit 1
          fi
        env:
          DEPLOY_SERVER_HOST: ${{ secrets.DEPLOY_SERVER_HOST }}
          DEPLOY_SERVER_USER: ${{ secrets.DEPLOY_SERVER_USER }}
          DEPLOY_SERVER_PATH: ${{ secrets.DEPLOY_SERVER_PATH }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Sync deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SERVER_HOST }}
          username: ${{ secrets.DEPLOY_SERVER_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          source: "manage.sh,docker-compose.yml,nginx.conf,.env.example"
          target: ${{ secrets.DEPLOY_SERVER_PATH }}
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_SERVER_PATH }}
          GHCR_REGISTRY: ${{ env.REGISTRY }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_APP: ${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}:${{ needs.build.outputs.git_hash }}
          IMAGE_NGINX: ${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}-nginx:${{ needs.build.outputs.git_hash }}
        with:
          host: ${{ secrets.DEPLOY_SERVER_HOST }}
          username: ${{ secrets.DEPLOY_SERVER_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          # 远程 docker compose pull 从 GHCR 拉镜像可能较慢，
          # 默认 command_timeout 仅 10m，会在拉取中途被掐断（Run Command Timeout）。
          command_timeout: 30m
          envs: DEPLOY_PATH,GHCR_REGISTRY,GHCR_USERNAME,GHCR_TOKEN,IMAGE_APP,IMAGE_NGINX
          script: |
            set -e

            cd "${DEPLOY_PATH}"
            chmod +x ./manage.sh

            # 登录 GHCR
            echo "${GHCR_TOKEN}" | docker login "${GHCR_REGISTRY}" -u "${GHCR_USERNAME}" --password-stdin

            # 通过 manage.sh 完成拉取、部署、健康检查
            ./manage.sh pull-deploy "${IMAGE_APP}" "${IMAGE_NGINX}"

  # ==================== 通知 ====================
  notify:
    name: Notify
    needs: [build, deploy]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Summary
        run: |
          {
            echo "# 部署结果"
            echo ""
            echo "| 项目 | 状态 |"
            echo "|------|------|"
            echo "| 构建 & 推送 | ${{ needs.build.result }} |"
            echo "| 部署 | ${{ needs.deploy.result || 'skipped' }} |"
            echo ""
            IMAGE_NAME_LOWER="${IMAGE_NAME,,}"
            if [[ "${{ needs.build.result }}" == "success" ]]; then
              echo "**镜像**: \`${{ env.REGISTRY }}/${IMAGE_NAME_LOWER}:${{ needs.build.outputs.git_hash }}\`"
              echo "**构建时间**: ${{ needs.build.outputs.build_time }}"
            fi
            if [[ "${{ needs.deploy.result }}" == "success" ]]; then
              echo "**服务器**: \`${{ secrets.DEPLOY_SERVER_HOST }}\`"
              echo "**健康检查**: 通过"
            fi
            if [[ "${{ needs.deploy.result }}" == "failure" ]]; then
              echo ""
              echo "> **部署失败** — 请检查 Deploy job 日志获取详细错误信息"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
