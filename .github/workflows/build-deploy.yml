# 构建与部署工作流
# 构建 Docker 镜像推送到 GHCR（部署时额外推送到腾讯云 TCR 个人版），通过 SSH 部署到阿里云 ECS 或腾讯云 CVM
# 阿里云与腾讯云均从 TCR 拉取镜像
#
# 触发条件: 仅手动触发 (workflow_dispatch)，可选择是否部署及部署目标
#
# 配置步骤:
#   在 GitHub 仓库 Settings -> Secrets and variables -> Actions -> Secrets 中添加:
#     - ALIYUN_HOST  / ALIYUN_USER  / ALIYUN_PATH  / ALIYUN_SSH_KEY   （部署阿里云时需要）
#     - TENCENT_HOST / TENCENT_USER / TENCENT_PATH / TENCENT_SSH_KEY  （部署腾讯云时需要）
#       HOST: 服务器 IP 或域名；USER: SSH 用户名；PATH: 部署目标路径；SSH_KEY: SSH 私钥（完整内容，包括 BEGIN/END）
#     - TENCENT_TCR_PASSWORD: TCR 个人版登录密码（两个目标共用）
#
#   在 Settings -> Secrets and variables -> Actions -> Variables 中添加:
#     - TENCENT_TCR_REGISTRY: TCR 地址（如 ccr.ccs.tencentyun.com）
#     - TENCENT_TCR_NAMESPACE: TCR 命名空间（需先在 TCR 个人版控制台创建）
#     - TENCENT_TCR_USERNAME: 腾讯云账号 UIN
#   TCR 中的镜像仓库为 <命名空间>/<仓库名> 与 <命名空间>/<仓库名>-nginx，首次推送时自动创建
#
#   构建与部署成功后调用 cleanup-registry.yml 清理 GHCR / TCR 旧镜像（配置见该文件）
#
#   部署 job 使用的 Environments（aliyun-production / tencent-production）首次运行时自动创建，
#   可在 Settings -> Environments 中为其配置审批人或分支限制
#
#   NEXT_PUBLIC_* 是【构建期】变量（会被内联进客户端 bundle，运行时 .env 改不动），
#   需配在 Settings -> Secrets and variables -> Actions -> Variables（非 Secrets，非敏感）:
#     - NEXT_PUBLIC_SITE_NAME / NEXT_PUBLIC_AUTH_METHOD /
#       NEXT_PUBLIC_DEFAULT_MODULE / NEXT_PUBLIC_ENABLED_MODULES / NEXT_PUBLIC_MODULE_NAMES
#     - NEXT_PUBLIC_DINGTALK_CORP_ID（登录方式为 dingtalk 时的兜底 corpId）
#   未配置时由各消费点的下游兜底回退到合理默认（如登录方式回退 email-otp）。

name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: '是否部署到服务器'
        required: true
        default: true
        type: boolean
      target:
        description: '部署目标'
        required: true
        default: aliyun
        type: choice
        options: [aliyun, tencent, all]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# github.repository may contain uppercase letters (e.g. sunweijieMJ/t3-app-temp)
# but Docker requires lowercase image names, so we normalize it in the prepare step.

jobs:
  # ==================== 构建并推送镜像 ====================
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    # 首次向 TCR 跨境推送全部镜像层耗时较长
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      git_hash: ${{ steps.info.outputs.git_hash }}
      build_time: ${{ steps.info.outputs.build_time }}
      image_app_tcr: ${{ vars.TENCENT_TCR_REGISTRY }}/${{ steps.repo.outputs.tcr_image_name }}:${{ steps.info.outputs.git_hash }}
      image_nginx_tcr: ${{ vars.TENCENT_TCR_REGISTRY }}/${{ steps.repo.outputs.tcr_image_name }}-nginx:${{ steps.info.outputs.git_hash }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Normalize image name
        id: repo
        run: |
          echo "image_name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
          tcr_image_name="${TCR_NAMESPACE}/${REPO_NAME}"
          echo "tcr_image_name=${tcr_image_name,,}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          TCR_NAMESPACE: ${{ vars.TENCENT_TCR_NAMESPACE }}
          REPO_NAME: ${{ github.event.repository.name }}

      - name: Generate build info
        id: info
        run: |
          echo "git_hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify TCR config
        if: inputs.deploy
        run: |
          has_error=0
          for var in TENCENT_TCR_REGISTRY TENCENT_TCR_NAMESPACE TENCENT_TCR_USERNAME TENCENT_TCR_PASSWORD; do
            if [[ -z "${!var}" ]]; then
              echo "::error::缺少 ${var}（在仓库 Actions Variables / Secrets 中配置）"
              has_error=1
            fi
          done
          [[ $has_error -eq 1 ]] && exit 1 || true
        env:
          TENCENT_TCR_REGISTRY: ${{ vars.TENCENT_TCR_REGISTRY }}
          TENCENT_TCR_NAMESPACE: ${{ vars.TENCENT_TCR_NAMESPACE }}
          TENCENT_TCR_USERNAME: ${{ vars.TENCENT_TCR_USERNAME }}
          TENCENT_TCR_PASSWORD: ${{ secrets.TENCENT_TCR_PASSWORD }}

      - name: Log in to TCR
        if: inputs.deploy
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.TENCENT_TCR_REGISTRY }}
          username: ${{ vars.TENCENT_TCR_USERNAME }}
          password: ${{ secrets.TENCENT_TCR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}
            name=${{ vars.TENCENT_TCR_REGISTRY }}/${{ steps.repo.outputs.tcr_image_name }},enable=${{ inputs.deploy }}
          tags: |
            type=raw,value=${{ steps.info.outputs.git_hash }}
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (app)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          target: runner
          # NEXT_PUBLIC_* 是构建期变量（会被内联进客户端 bundle），
          # 在 GitHub 仓库 Settings -> Secrets and variables -> Actions -> Variables 中配置。
          # 未配置时传空串，由各消费点的下游兜底回退到合理默认。
          build-args: |
            NEXT_PUBLIC_SITE_NAME=${{ vars.NEXT_PUBLIC_SITE_NAME }}
            NEXT_PUBLIC_MODULE_NAMES=${{ vars.NEXT_PUBLIC_MODULE_NAMES }}
            NEXT_PUBLIC_DEFAULT_MODULE=${{ vars.NEXT_PUBLIC_DEFAULT_MODULE }}
            NEXT_PUBLIC_ENABLED_MODULES=${{ vars.NEXT_PUBLIC_ENABLED_MODULES }}
            NEXT_PUBLIC_AUTH_METHOD=${{ vars.NEXT_PUBLIC_AUTH_METHOD }}
            NEXT_PUBLIC_DINGTALK_CORP_ID=${{ vars.NEXT_PUBLIC_DINGTALK_CORP_ID }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Extract nginx metadata
        id: nginx-meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}-nginx
            name=${{ vars.TENCENT_TCR_REGISTRY }}/${{ steps.repo.outputs.tcr_image_name }}-nginx,enable=${{ inputs.deploy }}
          tags: |
            type=raw,value=${{ steps.info.outputs.git_hash }}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (nginx)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          target: nginx
          # nginx 镜像从 builder 阶段拷贝 .next/static（已内联 NEXT_PUBLIC_*），
          # 必须与 app 镜像使用完全相同的 build-args，否则静态资源与服务端取值不一致。
          build-args: |
            NEXT_PUBLIC_SITE_NAME=${{ vars.NEXT_PUBLIC_SITE_NAME }}
            NEXT_PUBLIC_MODULE_NAMES=${{ vars.NEXT_PUBLIC_MODULE_NAMES }}
            NEXT_PUBLIC_DEFAULT_MODULE=${{ vars.NEXT_PUBLIC_DEFAULT_MODULE }}
            NEXT_PUBLIC_ENABLED_MODULES=${{ vars.NEXT_PUBLIC_ENABLED_MODULES }}
            NEXT_PUBLIC_AUTH_METHOD=${{ vars.NEXT_PUBLIC_AUTH_METHOD }}
            NEXT_PUBLIC_DINGTALK_CORP_ID=${{ vars.NEXT_PUBLIC_DINGTALK_CORP_ID }}
          tags: ${{ steps.nginx-meta.outputs.tags }}
          labels: ${{ steps.nginx-meta.outputs.labels }}

  # ==================== 部署到阿里云 ECS ====================
  deploy-aliyun:
    name: Deploy → 阿里云 ECS
    needs: build
    if: inputs.deploy && (inputs.target == 'aliyun' || inputs.target == 'all')
    uses: ./.github/workflows/_deploy-server.yml
    permissions:
      contents: read
    with:
      environment: aliyun-production
      registry: ${{ vars.TENCENT_TCR_REGISTRY }}
      registry_username: ${{ vars.TENCENT_TCR_USERNAME }}
      image_app: ${{ needs.build.outputs.image_app_tcr }}
      image_nginx: ${{ needs.build.outputs.image_nginx_tcr }}
    secrets:
      HOST: ${{ secrets.ALIYUN_HOST }}
      USER: ${{ secrets.ALIYUN_USER }}
      DEPLOY_PATH: ${{ secrets.ALIYUN_PATH }}
      SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
      REGISTRY_TOKEN: ${{ secrets.TENCENT_TCR_PASSWORD }}

  # ==================== 部署到腾讯云 CVM ====================
  deploy-tencent:
    name: Deploy → 腾讯云 CVM
    needs: build
    if: inputs.deploy && (inputs.target == 'tencent' || inputs.target == 'all')
    uses: ./.github/workflows/_deploy-server.yml
    permissions:
      contents: read
    with:
      environment: tencent-production
      registry: ${{ vars.TENCENT_TCR_REGISTRY }}
      registry_username: ${{ vars.TENCENT_TCR_USERNAME }}
      image_app: ${{ needs.build.outputs.image_app_tcr }}
      image_nginx: ${{ needs.build.outputs.image_nginx_tcr }}
    secrets:
      HOST: ${{ secrets.TENCENT_HOST }}
      USER: ${{ secrets.TENCENT_USER }}
      DEPLOY_PATH: ${{ secrets.TENCENT_PATH }}
      SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
      REGISTRY_TOKEN: ${{ secrets.TENCENT_TCR_PASSWORD }}

  # ==================== 清理镜像仓库 ====================
  cleanup:
    name: Cleanup Registry
    needs: [build, deploy-aliyun, deploy-tencent]
    if: >-
      always() && needs.build.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/cleanup-registry.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  # ==================== 通知 ====================
  notify:
    name: Notify
    needs: [build, deploy-aliyun, deploy-tencent, cleanup]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Summary
        run: |
          {
            echo "# 部署结果"
            echo ""
            echo "| 项目 | 状态 |"
            echo "|------|------|"
            echo "| 构建 & 推送 | ${{ needs.build.result }} |"
            echo "| 阿里云 ECS | ${{ needs.deploy-aliyun.result }} |"
            echo "| 腾讯云 CVM | ${{ needs.deploy-tencent.result }} |"
            echo "| 镜像清理 | ${{ needs.cleanup.result }} |"
            echo ""
            IMAGE_NAME_LOWER="${IMAGE_NAME,,}"
            if [[ "${{ needs.build.result }}" == "success" ]]; then
              echo "**镜像**: \`${{ env.REGISTRY }}/${IMAGE_NAME_LOWER}:${{ needs.build.outputs.git_hash }}\`"
              if [[ "${{ inputs.deploy }}" == "true" ]]; then
                echo ""
                echo "**TCR 镜像**: \`${{ needs.build.outputs.image_app_tcr }}\`"
              fi
              echo ""
              echo "**构建时间**: ${{ needs.build.outputs.build_time }}"
            fi
            if [[ "${{ needs.deploy-aliyun.result }}" == "failure" || "${{ needs.deploy-tencent.result }}" == "failure" ]]; then
              echo ""
              echo "> **部署失败** — 请检查 Deploy job 日志获取详细错误信息"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
