services:
  db:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: t3-app-temp
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/t3-app-temp
    depends_on:
      db:
        condition: service_started
    volumes:
      - uploads_data:/app/public/uploads

  nginx:
    build:
      context: .
      target: nginx
    restart: unless-stopped
    ports:
      - "5000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/usr/share/nginx/uploads:ro
    depends_on:
      - app

volumes:
  postgres_data:
  uploads_data:
